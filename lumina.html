<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lumina</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#0a0818;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
canvas{display:block;width:100%;height:100%}
#cap{position:fixed;left:0;right:0;bottom:11%;text-align:center;color:#f3eeff;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)}
#cap h1{margin:0;font-weight:200;font-size:clamp(28px,6.5vw,70px);letter-spacing:.55em;padding-left:.55em;text-shadow:0 0 40px rgba(184,161,255,.9)}
#cap p{margin:12px 0 0;font-size:clamp(11px,1.5vw,14px);letter-spacing:.4em;color:#a8f0da;text-transform:uppercase}
#bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#b8a1ff,#7fffd4,#ffb8a1,#ff9ec7)}
#msg{position:fixed;top:12px;right:16px;color:#8c84b8;font-size:12px;letter-spacing:.15em;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap"><h1></h1><p></p></div>
<div id="bar"></div>
<div id="msg">CLICK FOR FULLSCREEN</div>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform float uT; uniform vec2 uR; uniform vec2 uM;

vec3 pal(float t){
  vec3 c0=vec3(.72,.63,1.), c1=vec3(.5,1.,.83), c2=vec3(1.,.72,.63), c3=vec3(1.,.62,.78);
  t=fract(t)*4.;
  vec3 c=mix(c0,c1,smoothstep(0.,1.,t));
  c=mix(c,c2,smoothstep(1.,2.,t));
  c=mix(c,c3,smoothstep(2.,3.,t));
  c=mix(c,c0,smoothstep(3.,4.,t));
  return c;
}
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);
}
float fbm(vec2 p){
  float v=0.,a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){v+=a*noise(p);p=m*p;a*=.5;}
  return v;
}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

/* Scene 1: liquid aurora (domain-warped noise) */
vec3 sceneA(vec2 uv){
  vec2 p=uv*1.6+uM*.4; float t=uT;
  vec2 q=vec2(fbm(p+t*.10),fbm(p+vec2(5.2,1.3)-t*.12));
  vec2 r=vec2(fbm(p+3.*q+vec2(1.7,9.2)+t*.15),fbm(p+3.*q+vec2(8.3,2.8)-t*.126));
  float f=fbm(p+3.*r);
  vec3 c=pal(f*1.2+length(q)*.5+t*.03)*(smoothstep(.1,.9,f)*1.3+.12);
  c+=pal(r.x+.5)*pow(abs(1.-abs(f*2.-1.)),6.)*.9;
  return c;
}

/* Scene 2: iridescent raymarched orb with ring and satellites */
float map(vec3 p){
  float d=length(p)-1.+.1*sin(3.5*p.x+uT*1.1)*sin(3.5*p.y+uT*1.3)*sin(3.5*p.z+uT*.9);
  vec3 q=p; q.yz*=rot(uT*.4); q.xy*=rot(.5);
  d=min(d,length(vec2(length(q.xz)-1.9,q.y))-.035);
  for(int i=0;i<3;i++){
    float a=uT*(.5+.2*float(i))+float(i)*2.094;
    d=min(d,length(p-vec3(cos(a)*2.6,sin(a*1.7)*.6,sin(a)*2.6))-.14);
  }
  return d;
}
vec3 sceneB(vec2 uv){
  float ang=uT*.2+uM.x*2.;
  vec3 ro=vec3(sin(ang)*4.2,.9+uM.y*2.,cos(ang)*4.2);
  vec3 ww=normalize(-ro), uu=normalize(cross(ww,vec3(0.,1.,0.))), vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.6*ww);
  float t=0., md=10.;
  for(int i=0;i<72;i++){
    float d=map(ro+rd*t); md=min(md,d);
    if(d<.002||t>12.)break;
    t+=d*.8;
  }
  vec3 col=sceneA(uv*.8)*.55;
  if(t<12.){
    vec3 p=ro+rd*t; vec2 e=vec2(.002,0.);
    vec3 n=normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
    float fr=pow(1.-max(dot(n,-rd),0.),2.5);
    vec3 irid=pal(dot(n,rd)*.6+p.y*.15+uT*.05);
    vec3 env=pal(n.y*.25+uT*.04+.3);
    vec3 L=normalize(vec3(.5,.8,.3));
    float sp=pow(max(dot(reflect(-L,n),-rd),0.),40.);
    col=mix(irid*.45,env*1.1,fr)+fr*irid*.8+sp*.9;
  }
  col+=pal(uT*.05+.4)*exp(-md*5.)*.35*step(12.,t);
  return col;
}

/* Scene 3: kaleidoscope neon portal tunnel */
vec3 sceneC(vec2 uv){
  uv*=rot(uT*.08);
  float r=length(uv)+.0001, a=atan(uv.y,uv.x);
  a=abs(mod(a,.7854)-.3927);
  float z=.6/r+uT*.9;
  z+=fbm(vec2(a*6.,z*.5))*.4;
  float rings=pow(.5+.5*sin(z*5.),10.);
  float rays=pow(.5+.5*sin(a*40.+z),6.)*.5;
  vec3 c=pal(z*.08+a*.8+uT*.03)*(rings*1.4+rays+.12);
  c*=smoothstep(0.,.5,r);
  c+=pal(uT*.07)*.06/(r+.08);
  return c;
}

vec3 scn(int k,vec2 uv){
  if(k==0)return sceneA(uv);
  if(k==1)return sceneB(uv);
  return sceneC(uv);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uR)/uR.y;
  float seg=mod(uT,30.)/10.;
  int k=int(floor(seg));
  float m=smoothstep(.8,1.,fract(seg));
  int k2=k+1; if(k2>2)k2=0;
  vec3 c=scn(k,uv);
  if(m>0.)c=mix(c,scn(k2,uv),m);
  c*=1.-.4*dot(uv,uv);
  c=1.-exp(-c*1.4);
  c=pow(c,vec3(.95));
  c+=(hash(gl_FragCoord.xy+uT)-.5)*.025;
  gl_FragColor=vec4(c,1.);
}
</script>
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl');
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:20px">WebGL not supported in this browser.</p>'; }
const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
function sh(type, src) {
  const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o));
  return o;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uT = gl.getUniformLocation(prog, 'uT'), uR = gl.getUniformLocation(prog, 'uR'), uM = gl.getUniformLocation(prog, 'uM');

const scale = Math.min(devicePixelRatio || 1, 1.5) * 0.8;   // lower this (e.g. 0.5) if slow
function resize() { cv.width = innerWidth * scale; cv.height = innerHeight * scale; gl.viewport(0, 0, cv.width, cv.height); }
addEventListener('resize', resize); resize();

let mx = 0, my = 0, tx = 0, ty = 0;
addEventListener('pointermove', e => { tx = e.clientX / innerWidth - .5; ty = .5 - e.clientY / innerHeight; });
addEventListener('click', () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); });

const names = [['FLOW', 'liquid aurora'], ['ORBIT', 'iridescent glass orb'], ['PORTAL', 'kaleidoscope tunnel']];
const cap = document.getElementById('cap'), h1 = cap.querySelector('h1'), sub = cap.querySelector('p'), bar = document.getElementById('bar');
let last = -1;
const t0 = performance.now();
function frame() {
  const t = (performance.now() - t0) / 1000, tt = t % 30, idx = Math.floor(tt / 10), local = tt - idx * 10;
  mx += (tx - mx) * .05; my += (ty - my) * .05;
  gl.uniform1f(uT, t); gl.uniform2f(uR, cv.width, cv.height); gl.uniform2f(uM, mx, my);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (idx !== last) { h1.textContent = names[idx][0]; sub.textContent = names[idx][1]; last = idx; }
  cap.style.opacity = Math.max(0, Math.min(local - .8, 7.8 - local, 1));
  bar.style.width = (tt / 30 * 100) + '%';
  if (t > 8) document.getElementById('msg').style.opacity = 0;
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
